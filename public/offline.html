<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mất kết nối mạng · PGDCN TVCI</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #059669;
        --accent-hover: #10b981;
        --border: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.25rem 2rem;
        max-width: 26rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      }
      .icon-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.75rem;
        background-color: rgba(5, 150, 105, 0.15);
        color: var(--accent);
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
      }
      .retry-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.5rem;
        border-radius: 0.5rem;
        background-color: var(--accent);
        color: #ffffff;
        font-size: 0.8125rem;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .retry-btn:hover {
        background-color: var(--accent-hover);
      }
      .brand {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        font-size: 0.6875rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card" role="alert" aria-live="assertive">
      <div class="icon-container" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Không có kết nối mạng</h1>
      <p>Ứng dụng PGDCN không thể kết nối tới máy chủ. Vui lòng kiểm tra lại kết nối Wi-Fi hoặc dữ liệu di động của bạn và thử lại.</p>
      <button class="retry-btn" type="button" onclick="window.location.reload()">
        Thử tải lại trang
      </button>
      <div class="brand">Phòng Giám định - Chứng nhận · TVCI</div>
    </div>
  </body>
</html>
